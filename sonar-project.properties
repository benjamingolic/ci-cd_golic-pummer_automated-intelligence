# SonarQube project configuration
# Run analysis with: sonar-scanner

sonar.projectKey=ci-cd-test-app
sonar.projectName=CI/CD Test App – User & Task Management API
sonar.projectVersion=1.0.0

sonar.sources=src
sonar.tests=tests

sonar.language=js
sonar.sourceEncoding=UTF-8

# Point SonarQube at the Jest LCOV report generated by --coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=node_modules/**,coverage/**,**/*.test.js
sonar.test.inclusions=tests/**/*.test.js
