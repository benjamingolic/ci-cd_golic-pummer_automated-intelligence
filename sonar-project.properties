# SonarQube project configuration
# Run analysis with: sonar-scanner

sonar.projectKey=benjamingolic_ci-cd_golic-pummer_automated-intelligence
sonar.organization=benjamingolic
sonar.projectVersion=1.0.0

sonar.sources=src
sonar.tests=tests

sonar.language=js
sonar.sourceEncoding=UTF-8

# Point SonarQube at the Jest LCOV report generated by --coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=node_modules/**,coverage/**,**/*.test.js
sonar.test.inclusions=tests/**/*.test.js
